name: Print & API Testing CI

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  print-tests:
    runs-on: ubuntu-latest
    name: Run Print Tests

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install system dependencies
        run: sudo apt-get install -y poppler-utils

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run Pytest for Print Tests
        run: pytest test_print.py -v --html=print-report.html --self-contained-html

      - name: Upload Print Test Report
        uses: actions/upload-artifact@v4
        with:
          name: print-test-report
          path: print-report.html

  api-tests:
    runs-on: ubuntu-latest
    name: Run API Tests
    needs: print-tests  # optional: run after print-tests

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Start Flask API
        run: python api.py &
        shell: bash

      - name: Run Pytest for API Tests
        run: pytest test_api.py -v --html=api-report.html --self-contained-html

      - name: Upload API Test Report
        uses: actions/upload-artifact@v4
        with:
          name: api-test-report
          path: api-report.html
